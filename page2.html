<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page 2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    nav a {
      margin-right: 15px;
    }

    /* Default button style */
    button {
      background: #e0e0e0;
      color: black;
      border: 2px solid #555;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease-in-out;
      border-radius: 6px;
    }

    /* Hover effect */
    button:hover {
      background: #cfcfcf;
      border-color: #222;
    }

    /* Click effect */
    button:active {
      background: #b5b5b5;
      transform: scale(0.97);
    }

    /* High-contrast mode */
    .high-contrast {
      background: black;
      color: yellow;
    }

    /* Button in high-contrast mode */
    .high-contrast button {
      background: yellow;
      color: black;
      border-color: yellow;
    }

    .high-contrast button:hover {
      background: #ffea00;
    }

    .high-contrast button:active {
      background: #e6d200;
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <h1>Page 2</h1>

  <p>This is a placeholder second page for navigation testing.</p>

  <button 
    title="Toggle High Contrast Mode"
    onclick="document.body.classList.toggle('high-contrast')">
    Visual Aid
  </button>

  <nav>
    <a href="../index.html">Back to Home</a>
  </nav>
</body>
</html>
